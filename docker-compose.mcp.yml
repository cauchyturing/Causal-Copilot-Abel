# docker-compose.mcp.yml — One-command MCP server startup
# Usage: docker compose -f docker-compose.mcp.yml up
services:
  causal-copilot-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp-core
    image: abel/causal-copilot-mcp:latest
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
