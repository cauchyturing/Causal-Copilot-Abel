# smithery.yaml — MCP registry listing
# https://smithery.ai — enables one-click install in Claude Desktop, Cursor, etc.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      openaiApiKey:
        type: string
        description: "OpenAI API key (when llmProvider=openai)"
      openrouterApiKey:
        type: string
        description: "OpenRouter API key (when llmProvider=openrouter)"
      llmProvider:
        type: string
        description: "LLM provider: openai, openrouter, ollama"
        default: "openai"
      offline:
        type: boolean
        description: "Rule-based mode (no LLM needed)"
        default: false
  commandFunction: |
    (config) => ({
      command: 'python',
      args: ['-m', 'causal_copilot.mcp'],
      env: {
        OPENAI_API_KEY: config.openaiApiKey || '',
        OPENROUTER_API_KEY: config.openrouterApiKey || '',
        LLM_PROVIDER: config.llmProvider || 'openai',
      }
    })
